<!doctype html><html lang="pt-BR"><head><link rel="icon" type="image/png" href="/assets/img/favicon.png"><meta name="description" content="Corrente elétrica: portadores de carga, quantização da carga, intensidade de corrente, sentido convencional, gráficos i × t, corrente contínua e alternada e efeitos da corrente. Aula interativa em slides, com laboratórios e exercícios."><script>/* Professor Madison: respeita a opção "Reduzir animações" do site e a configuração do aparelho */(function(){try{var m=localStorage.getItem("pm_motion");var os=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;window.PM_RM=(m==="reduce")||(m!=="full"&&os);if(window.PM_RM){var s=document.createElement("style");s.textContent="*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}";document.head.appendChild(s)}}catch(e){window.PM_RM=false}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circuitos Elétricos | Professor Madison</title><style>
:root{--bg:#071326;--card:#10233c;--border:#284362;--text:#f1f7ff;--muted:#b2c8df;--cyan:#47dcf3;--gold:#ffd166;--pink:#ff7b9d;--green:#63e3b0}*{box-sizing:border-box}body{margin:0;background:#050d19;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}button,input{font:inherit}button{cursor:pointer}.deck{height:100dvh;width:100vw;display:flex;flex-direction:column}.top{height:51px;flex-shrink:0;background:#061020;display:flex;align-items:center;justify-content:space-between;padding:0 23px;border-bottom:1px solid #223a55;gap:10px}.brand{font-size:13px;letter-spacing:.09em;font-weight:800}.brand b{color:var(--cyan)}.top small{color:var(--muted)}.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:17px 20px}.slide{width:min(1300px,100%);height:100%;max-height:735px;overflow-y:auto;position:relative;background:radial-gradient(circle at 100% 0%,#173957 0,transparent 44%),linear-gradient(140deg,#09182e,#0a1b32 66%,#09172b);border:1px solid #2d4561;border-radius:19px;box-shadow:0 18px 55px #0007;padding:clamp(24px,3vw,49px) clamp(24px,5vw,70px);scrollbar-width:thin}.slide::after{content:'PROFESSOR MADISON • FÍSICA';position:absolute;bottom:15px;right:26px;font-size:9px;letter-spacing:.15em;color:#6788a7}.eyebrow{color:var(--cyan);text-transform:uppercase;letter-spacing:.16em;font-weight:800;font-size:13px;margin-bottom:13px}h1{font-size:clamp(42px,6vw,79px);line-height:1.05;margin:11px 0 20px;max-width:950px}h2{font-size:clamp(29px,3.1vw,47px);line-height:1.13;margin:6px 0 20px;letter-spacing:-.025em}h3{font-size:clamp(19px,1.7vw,25px);margin:0 0 12px;color:var(--cyan)}p,li{font-size:clamp(16px,1.5vw,22px);line-height:1.5;color:#e2effd}p{margin:12px 0}.muted{color:var(--muted)}.lead{font-size:clamp(20px,2.2vw,31px);max-width:950px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.panel{background:#11263ebd;border 6;stroke-width:4;fill:none}.chart .axis{stroke:#c7ddee;stroke-width:2}.chart .area{fill:#47dcf32b}.svgbox{width:100%;height:auto;max-height:310px}.question button,.choice{display:block;text-align:left;width:100%;margin:9px 0;padding:12px 16px;border:1px solid #31577b;border-radius:10px;background:#152b44;color:white;font-size:clamp(16px,1.45vw,20px)}.choice:hover{border-color:#51dffc}.feedback{min-height:43px;margin-top:12px;font-size:18px;color:var(--gold);font-weight:700}.control{accent-color:#44dcff;width:100%}.readout{font-size:25px;font-weight:800;color:var(--gold)}.divider{height:1px;background:#33516f;margin:15px 0}.tiny{font-size:14px!important;color:#a8bed7!important}.flex{display:flex;align-items:center;gap:20px}.flex>*{flex:1}.note{font-size:clamp(16px,1.4vw,19px);background:#113247;padding:12px 16px;border-radius:11px}.reveal{display:none}.reveal.show{display:block}.dots{display:inline-block;color:var(--gold);font-size:30px;letter-spacing:7px}.circuit-wire{stroke:#94dcef;stroke-width:7;fill:none;stroke-linecap:round}.electron{fill:#45e6fa}.tlabel{fill:#eefaff;font-size:16px}.list-tight li{margin-bottom:7px}.hero{padding-top:5vh}.hero .formula{max-width:730px}.sectionNo{position:absolute;right:70px;top:55px;color:#244766;font-size:120px;font-weight:900;z-index:0;pointer-events:none}.slide>*{position:relative;z-index:1}.inputline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.inputline input{max-width:140px;background:#081a2e;color:white;border:1px solid #4a7594;border-radius:9px;padding:12px;font-size:20px}.printonly{display:none}@media(max-width:750px){.top small{display:none}.slide{padding:25px 20px 40px}.grid,.grid3{grid-template-columns:1fr}.stage{padding:8px}.nav{padding:0 8px;gap:6px}.nav button{padding:9px}.chart{height:210px}.panel{padding:15px}body{overflow:hidden}}@media print{body{overflow:visible;background:white}.top,.nav{display:none}.deck{height:auto}.stage{display:block;padding:0}.slide{display:block!important;width:100%;height:190mm;max-height:none;page-break-after:always;border-radius:0;overflow:hidden;box-shadow:none;margin:0}.printonly{display:block}}
</style></head><body><div class="deck"><header class="top"><div class="brand">PROFESSOR <b>MADISON</b> <span style="opacity:.5">/ LABORATÓRIO DE FÍSICA</span></div><small>FRENTE A • CAPÍTULO 5 • 3ª SÉRIE EM</small><button class="act" id="full">⛶ Tela cheia</button></header><main class="stage"><article class="slide" id="slide"></article></main><footer class="nav"><button id="prev">← Anterior</button><button id="next">Próximo →</button><div class="progress"><div id="bar"></div></div><span class="count" id="count"></span><button id="menu">☷ Índice</button></footer></div>
<script>
const S=[];const add=(chapter,title,html)=>S.push({chapter,title,html});const F=(x)=>`<div class="formula">${x}</div>`;const P=(a,b)=>`<div class="grid"><div class="panel">${a}</div><div class="panel">${b}</div></div>`;const step=(...x)=>`<ol class="steps">${x.map(t=>`<li>${t}</li>`).join('')}</ol>`;
add('ABERTURA','Circuitos elétricos',`<div class="hero"><div class="eyebrow">Frente A · Capítulo 5 · Bernoulli</div><h1>O invisível que movimenta o mundo moderno</h1><p class="lead">Corrente elétrica, circuitos, gráficos e efeitos da eletricidade — da física microscópica aos dispositivos do cotidiano.</p><div class="formula sm" style="text-align:left;max-width:650px">CARGAS → MOVIMENTO → ENERGIA</div><p class="muted">Professor Madison · Física · 3ª série do Ensino Médio</p></div>`);
add('ABERTURA','O que você aprenderá?',`<div class="grid3"><div class="panel"><h3>01 · Entender</h3><p>Por que cargas elétricas se movem em um circuito e qual é a função de uma fonte.</p></div><div class="panel"><h3>02 · Quantificar</h3><p>Relacionar intensidade, carga, tempo e número de portadores de carga.</p></div><div class="panel"><h3>03 · Interpretar</h3><p>Entender gráficos <b>i × t</b>, corrente contínua e alternada.</p></div></div><div class="callout">Questão orientadora: como uma lâmpada acende quase imediatamente, se os elétrons se deslocam lentamente no fio?</div>`);
add('ABERTURA','A pergunta inicial',`<h2>O que realmente chega à lâmpada?</h2>${P('<h3>Hipótese A</h3><p>Elétrons saem da pilha, percorrem todo o fio e só então a lâmpada acende.</p>','<h3>Hipótese B</h3><p>As cargas já estão presentes no circuito; o campo elétrico se estabelece e coloca os portadores em movimento.</p>')}<p>Discuta a diferença entre <span class="em">propagação do sinal elétrico</span> e <span class="em">velocidade média de deriva dos elétrons</span>.</p><div class="callout">Retomaremos essa pergunta depois de compreender o circuito fechado.</div>`);
add('FUNDAMENTOS','Carga elétrica: o ponto de partida',`<p>A matéria contém partículas eletricamente carregadas. Em metais, elétrons de condução podem mover-se pelo material.</p>${P('<h3>Portadores de carga</h3><p>Metais: predominam os <b>elétrons</b>.<br>Soluções eletrolíticas: movem-se <b>íons positivos e negativos</b>.<br>Gases ionizados: podem mover-se elétrons e íons.</p>','<h3>Unidade de carga</h3><p>SI: <b>coulomb (C)</b>.</p>'+F('e = 1,6 × 10<sup>−19</sup> C')+'<p class="tiny">e representa o módulo da carga elementar.</p>')}<p class="note">Elétron: carga <b>−e</b>. Próton: carga <b>+e</b>. Um corpo eletricamente neutro pode conter muitas cargas.</p>`);
add('FUNDAMENTOS','Quantização da carga elétrica',`<p>Se um conjunto possui <b>n</b> portadores de carga elementar, o módulo da carga total é:</p>${F('|ΔQ| = n · e')}${step('n é um número de portadores (sem unidade).','e é o módulo da carga elementar, em coulombs.','O produto n·e fornece o módulo da carga transportada, em C.')}<div class="callout">A expressão se aplica quando todos os portadores considerados possuem módulo de carga e. Íons com carga de módulo 2e exigem adaptação.</div>`);
add('FUNDAMENTOS','Exemplo · quantização',`<h2>Quantos elétrons correspondem a 4,8 C?</h2>${step('Dado: |ΔQ| = 4,8 C; e = 1,6 × 10<sup>−19</sup> C.','Isolamento: n = |ΔQ| / e.','Substituição: n = 4,8 / (1,6 × 10<sup>−19</sup>).','Divisão dos coeficientes: 4,8 ÷ 1,6 = 3.','Conclusão: <b>n = 3,0 × 10<sup>19</sup> elétrons</b>.')}<p class="muted">O número é muito grande porque a carga de cada elétron é extremamente pequena.</p>`);
add('FUNDAMENTOS','Um circuito elétrico precisa de quê?',`<div class="grid3"><div class="panel"><h3>Fonte</h3><p>Estabelece e mantém uma diferença de potencial entre terminais, fornecendo energia ao circuito.</p></div><div class="panel"><h3>Condutores</h3><p>Formam os caminhos pelos quais as cargas se deslocam.</p></div><div class="panel"><h3>Receptor</h3><p>Lâmpada, motor ou outro componente transforma energia elétrica.</p></div></div><div class="callout">Para haver corrente sustentada neste circuito simples, o caminho condutor precisa estar fechado.</div>`);
add('FUNDAMENTOS','Diagrama · circuito simples',`<svg class="svgbox" viewBox="0 0 900 310" aria-label="Circuito de pilha, interruptor e lâmpada"><path class="circuit-wire" d="M130 80 H330 M440 80 H690 V250 H130 V80"/><path class="circuit-wire" d="M330 80 L413 45" id="switchBlade"/><circle cx="330" cy="80" r="8" fill="#ffd166"/><circle cx="440" cy="80" r="8" fill="#ffd166"/><circle cx="690" cy="160" r="47" fill="#09172b" stroke="#ffd166" stroke-width="5"/><path d="M660 130 L720 190 M720 130 L660 190" stroke="#ffd166" stroke-width="5"/><path d="M130 192 v40 M150 183 v58" stroke="#d6eeff" stroke-width="8"/><text x="90" y="210" class="tlabel">−</text><text x="160" y="210" class="tlabel">+</text><text x="80" y="276" class="tlabel">Pilha</text><text x="325" y="125" class="tlabel">Interruptor</text><text x="737" y="169" class="tlabel">Lâmpada</text></svg><div class="flex"><button class="act" onclick="switchCircuit()" id="switchBtn">Fechar interruptor</button><p class="readout" id="bulbState">Circuito aberto: lâmpada apagada</p></div><p class="tiny">Esquema conceitual simplificado. Os elétrons estão presentes em todo o fio antes do acionamento.</p>`);
add('FUNDAMENTOS','Circuito aberto e circuito fechado',`${P('<h3>Circuito aberto</h3><p>Um trecho está interrompido. Em um circuito ideal simples, não há circulação contínua de carga.</p>','<h3>Circuito fechado</h3><p>Existe um percurso condutor completo. A fonte pode manter movimento orientado de portadores.</p>')}<div class="callout">Campo elétrico não significa necessariamente corrente: é preciso haver portadores móveis e condições materiais adequadas.</div>`);
add('FUNDAMENTOS','O papel do campo elétrico',`<p>Sem campo elétrico aplicado, a agitação térmica dos elétrons nos metais não produz fluxo líquido orientado de carga.</p>${P('<h3>Movimento térmico</h3><p>Desordenado, intenso e em diversas direções. A corrente média resultante pode ser nula.</p>','<h3>Movimento de deriva</h3><p>Ao aplicar um campo elétrico, há uma pequena velocidade média orientada dos portadores, superposta à agitação térmica.</p>')}<p class="note">Nos metais, os elétrons derivam em sentido <b>oposto</b> ao campo elétrico. O sinal elétrico se propaga pelo circuito muito mais rapidamente do que a velocidade média de deriva.</p>`);
add('CORRENTE','O que é corrente elétrica?',`<h2>Movimento orientado de cargas elétricas</h2><p>A corrente elétrica é o fluxo líquido de carga através de uma superfície transversal de um condutor, durante um intervalo de tempo.</p>${F('i<sub>m</sub> = |ΔQ| / Δt')}<p><span class="em">i<sub>m</sub></span>: intensidade média da corrente; <span class="em">|ΔQ|</span>: módulo da carga transportada; <span class="em">Δt</span>: intervalo de tempo.</p><div class="callout">A corrente não é, propriamente, a velocidade dos elétrons: mede a taxa de passagem de carga.</div>`);
add('CORRENTE','Demonstração da intensidade média',`${step('Imagine uma seção transversal fixa de um fio condutor.','Conte a quantidade total de carga |ΔQ| que atravessa essa seção durante o intervalo Δt.','Uma passagem de mais carga, no mesmo tempo, significa corrente maior.','O mesmo total de carga passando em menos tempo também significa corrente maior.','A razão entre carga transportada e tempo fornece a intensidade média.')} ${F('i<sub>m</sub> = |ΔQ| / Δt')}`);
add('CORRENTE','A unidade ampere',`${F('1 A = 1 C / 1 s')}<p>Uma corrente de 1 ampere significa a passagem de um coulomb de carga por segundo através de uma seção transversal.</p>${P('<h3>Múltiplos e submúltiplos</h3><p>1 mA = 10<sup>−3</sup> A<br>1 μA = 10<sup>−6</sup> A<br>1 nA = 10<sup>−9</sup> A<br>1 pA = 10<sup>−12</sup> A</p>','<h3>Comparação</h3><p>2 A = 2.000 mA<br>45 mA = 0,045 A<br>800 μA = 0,0008 A</p>')}<div class="callout">Ampere mede corrente; coulomb mede carga. Não são unidades equivalentes.</div>`);
add('CORRENTE','Exemplo resolvido · a carga',`<h2>Um condutor é percorrido por 3 A durante 40 s. Qual a carga transportada?</h2>${step('Dados: i = 3 A; Δt = 40 s.','Equação: i = |ΔQ| / Δt.','Multiplique ambos os membros por Δt: i·Δt = |ΔQ|.','Substitua: |ΔQ| = 3 × 40.','Resultado: <b>|ΔQ| = 120 C</b>.')}<p class="note">Conferência das unidades: A·s = (C/s)·s = C.</p>`);
add('CORRENTE','Exemplo resolvido · o tempo',`<h2>Passam 90 C através de um fio com corrente constante de 1,5 A. Quanto tempo decorre?</h2>${step('Dados: |ΔQ| = 90 C; i = 1,5 A.','Parta de i = |ΔQ| / Δt.','Multiplique por Δt: i·Δt = |ΔQ|.','Divida por i: Δt = |ΔQ| / i.','Cálculo: Δt = 90 / 1,5 = <b>60 s</b>.')}<p class="muted">O isolamento de incógnitas é parte do raciocínio físico, não um procedimento mecânico separado dele.</p>`);
add('CORRENTE','Corrente e número de elétrons',`${F('|ΔQ| = n · e')}${F('i<sub>m</sub> = |ΔQ| / Δt') }<p>Substituindo a primeira relação na segunda:</p>${F('i<sub>m</sub> = n · e / Δt')}<p>Isolando o número de elétrons:</p>${F('n = i<sub>m</sub> · Δt / e')}<p class="tiny">Em cada relação, use valores em C, A e s.</p>`);
add('CORRENTE','Exemplo resolvido · número de elétrons',`<h2>Em 3 minutos, passam 2 A. Quantos elétrons atravessam a seção?</h2>${step('Converta o tempo: 3 min × 60 = 180 s.','Determine a carga: |ΔQ| = i·Δt = 2 × 180 = 360 C.','Use n = |ΔQ|/e.','n = 360 / (1,6 × 10<sup>−19</sup>).','n = (360/1,6) × 10<sup>19</sup> = 225 × 10<sup>19</sup>.','Resposta: <b>2,25 × 10<sup>21</sup> elétrons</b>.')}<p class="muted">Corresponde ao exercício resolvido da página 12 do capítulo.</p>`);
add('CORRENTE','Laboratório · altere corrente e tempo',`<p>Para corrente constante, observe como a carga aumenta com o tempo:</p><div class="grid"><div class="panel"><label>Intensidade: <span class="readout" id="iVal">2,0 A</span></label><input class="control" type="range" id="iSlider" min="0.5" max="10" step="0.5" value="2"><label>Tempo: <span class="readout" id="tVal">10 s</span></label><input class="control" type="range" id="tSlider" min="1" max="60" step="1" value="10"></div><div class="panel"><h3>Modelo matemático</h3><div class="formula sm" id="qEq">|ΔQ| = 2 × 10</div><div class="readout" id="qVal">20 C</div></div></div><p class="note">Experimente dobrar apenas a corrente. Depois, retorne e dobre apenas o tempo. Que proporcionalidade aparece?</p>`);
add('SENTIDO','Sentido convencional × sentido real',`<div class="grid"><div class="panel"><h3 class="cyan">Corrente convencional</h3><p>Sentido atribuído ao deslocamento de cargas <b>positivas</b>: do maior potencial para o menor potencial no circuito externo simples.</p><div class="formula sm">+ → −</div></div><div class="panel"><h3 class="pink">Elétrons em metais</h3><p>Portadores <b>negativos</b>: deslocamento médio em direção oposta ao sentido convencional.</p><div class="formula sm">− → +</div></div></div><div class="callout">A convenção de corrente foi estabelecida historicamente antes de se conhecer a natureza do transporte eletrônico em metais.</div>`);
add('SENTIDO','Por que duas setas opostas?',`<svg class="svgbox" viewBox="0 0 920 260"><rect x="70" y="70" width="770" height="105" rx="45" fill="#204563" stroke="#417b9a" stroke-width="4"/><g id="flowDots">${Array.from({length:10},(_,k)=>`<circle cx="${130+k*68}" cy="122" r="12" fill="#52dff1"/>`).join('')}</g><path d="M130 33 H790" stroke="#ffcf64" stroke-width="7"/><path d="M790 33 l-24 -15 v30z" fill="#ffcf64"/><path d="M790 218 H130" stroke="#fb84a4" stroke-width="7"/><path d="M130 218 l24 -15 v30z" fill="#fb84a4"/><text x="330" y="24" class="tlabel">Corrente convencional →</text><text x="340" y="249" class="tlabel">← Elétrons (metal)</text></svg><p>Corrente elétrica é definida pelo <b>fluxo de carga com sinal</b>; cargas negativas movendo-se para a esquerda equivalem a corrente convencional para a direita.</p>`);
add('SENTIDO','Quando há íons positivos e negativos',`<p>Em uma solução eletrolítica, <b>cátions</b> e <b>ânions</b> podem mover-se simultaneamente em sentidos contrários.</p>${P('<h3>Cátions (+)</h3><p>Seu movimento tem o <b>mesmo sentido</b> da corrente convencional.</p>','<h3>Ânions (−)</h3><p>Seu movimento em sentido contrário também <b>contribui para a corrente no mesmo sentido convencional</b>.</p>')}<p class="callout">A corrente elétrica não exige que todos os portadores caminhem fisicamente no mesmo sentido.</p>`);
add('GRÁFICOS','Gráfico de corrente constante',`<div class="grid"><div><svg class="chart" viewBox="0 0 550 280"><path class="axis" d="M70 220 H510 M70 240 V24"/><path class="area" d="M70 88 H440 V220 H70Z"/><path class="line" d="M70 88 H440"/><text x="13" y="45">i (A)</text><text x="463" y="250">t (s)</text><text x="28" y="93">4</text><text x="431" y="248">8</text><text x="105" y="170">Área = carga</text></svg></div><div><h3>Como interpretar?</h3><p>A intensidade de corrente é <b>4 A</b> durante <b>8 s</b>.</p>${F('|ΔQ| = 4 × 8 = 32 C')}<p>A carga corresponde à área do retângulo delimitado pela linha e pelo eixo do tempo.</p></div></div>`);
add('GRÁFICOS','Área no gráfico i × t',`<p>Para corrente não negativa, a carga transportada durante o intervalo pode ser calculada pela área geométrica sob a curva.</p>${P('<h3>Retângulo</h3>'+F('A = base · altura')+'<p>Corrente constante.</p>','<h3>Triângulo</h3>'+F('A = base · altura / 2')+'<p>Corrente variando linearmente de zero até um valor.</p>')}<p class="callout">Cuidado: para gráficos com corrente negativa, áreas acima e abaixo do eixo indicam sentidos opostos. A soma algébrica fornece a carga líquida orientada; somar todos os módulos responde a outra pergunta.</p>`);
add('GRÁFICOS','Exemplo · gráfico triangular',`<div class="grid"><svg class="chart" viewBox="0 0 550 280"><path class="axis" d="M70 220 H510 M70 240 V20"/><path class="area" d="M70 220 L440 63 V220 Z"/><path class="line" d="M70 220 L440 63"/><text x="13" y="45">i (A)</text><text x="463" y="250">t (s)</text><text x="29" y="66">6</text><text x="433" y="248">10</text></svg><div><h3>Determine a carga</h3>${step('Base: 10 s.','Altura: 6 A.','Área triangular: (10 × 6)/2.','Resultado: <b>30 C</b>.')}<p class="tiny">Produto A·s equivale a C.</p></div></div>`);
add('GRÁFICOS','Exemplo · trapézio',`<div class="grid"><svg class="chart" viewBox="0 0 550 280"><path class="axis" d="M70 220 H510 M70 240 V20"/><path class="area" d="M70 168 L440 65 V220 H70 Z"/><path class="line" d="M70 168 L440 65"/><text x="15" y="38">i (A)</text><text x="28" y="171">2</text><text x="28" y="66">6</text><text x="433" y="247">8</text><text x="462" y="251">t (s)</text></svg><div>${step('No início, i = 2 A; no final, i = 6 A.','A base horizontal representa 8 s.','Área do trapézio: A = (B+b)·h/2.','Aqui, bases paralelas de 2 A e 6 A; distância entre elas de 8 s.','|ΔQ| = (2+6)×8/2 = <b>32 C</b>.')}</div></div>`);
add('GRÁFICOS','Atividade · gráfico em três trechos',`<h2>Calcule a carga total</h2><svg class="chart" viewBox="0 0 900 270"><path class="axis" d="M75 218 H850 M75 235 V22"/><path class="area" d="M75 218 L275 62 H530 V218 Z"/><path class="area" d="M530 218 L530 62 L770 218 Z"/><path class="line" d="M75 218 L275 62 H530 L770 218"/><text x="12" y="38">i (mA)</text><text x="34" y="68">64</text><text x="264" y="247">2</text><text x="518" y="247">5</text><text x="763" y="247">8</text><text x="808" y="251">t (s)</text></svg><p>Separe a região em <b>triângulo + retângulo + triângulo</b>. A unidade da área inicialmente será <b>mA·s = mC</b>.</p><button class="act" onclick="reveal('graphAnswer')">Exibir resolução completa</button><div class="reveal" id="graphAnswer"><p>1º trecho: (2×64)/2 = 64 mC. 2º trecho: 3×64 = 192 mC. 3º trecho: (3×64)/2 = 96 mC.</p>${F('Q = 64 + 192 + 96 = 352 mC = 0,352 C')}<p class="tiny">A representação reproduz a estrutura do gráfico do exercício 03 da página 12. Sua leitura é de 0 a 2 s, 2 a 5 s e 5 a 8 s.</p></div>`);
add('GRÁFICOS','Laboratório · área e corrente',`<h2>Monte um gráfico retangular</h2><div class="grid"><div class="panel"><label>Corrente constante: <b id="graphI">3 A</b></label><input class="control" type="range" min="1" max="10" value="3" step="1" id="graphIslider"><label>Tempo: <b id="graphT">5 s</b></label><input class="control" type="range" min="1" max="15" value="5" step="1" id="graphTslider"></div><svg class="chart" id="dynamicChart" viewBox="0 0 550 280"><path class="axis" d="M70 220 H510 M70 240 V20"/><rect x="70" y="160" width="135" height="60" fill="#47dcf348" stroke="#ffd166" stroke-width="4" id="barRect"/><text x="10" y="40">i (A)</text><text x="460" y="250">t (s)</text></svg></div><div class="formula sm" id="graphFormula">Área = 3 × 5 = 15 C</div><p class="tiny">O gráfico é didático; os controles alteram simultaneamente altura, base e área.</p>`);
add('CORRENTES','Corrente contínua (CC)',`<p>Em corrente contínua, o <b>sentido convencional</b> da corrente é mantido. Uma pilha ideal associada a uma resistência constante fornece corrente aproximadamente constante.</p><svg class="chart" viewBox="0 0 900 270"><path class="axis" d="M80 214 H830 M80 232 V28"/><path class="line" d="M80 95 H815"/><text x="15" y="45">i (A)</text><text x="788" y="250">tempo</text><text x="95" y="76">i constante e positiva</text></svg><p class="callout">Corrente contínua não precisa ser rigorosamente constante em intensidade; o ponto definidor é que não inverte seu sentido.</p>`);
add('CORRENTES','Corrente alternada (CA)',`<p>Na corrente alternada, o sentido muda periodicamente. Um exemplo muito comum é o comportamento senoidal.</p><svg class="chart" viewBox="0 0 900 270"><path class="axis" d="M80 137 H832 M80 232 V23"/><path id="acSine" class="line" d=""/><text x="15" y="44">i (A)</text><text x="785" y="161">tempo</text><text x="95" y="84" fill="#ffd166">+</text><text x="95" y="209" fill="#ffd166">−</text></svg><p>Acima do eixo: um sentido convencional. Abaixo do eixo: sentido oposto.</p>`);
add('CORRENTES','Período e frequência',`<p>Uma corrente alternada periódica repete o seu comportamento após um <b>período T</b>.</p>${F('f = 1 / T   ⇔   T = 1 / f')}${P('<h3>Período (T)</h3><p>Tempo necessário para completar um ciclo. Unidade: segundo (s).</p>','<h3>Frequência (f)</h3><p>Número de ciclos em cada segundo. Unidade: hertz (Hz).</p>')}<p>Exemplo: frequência de 60 Hz → T = 1/60 s ≈ <b>0,0167 s = 16,7 ms</b>.</p><p class="tiny">A frequência da rede brasileira é tipicamente 60 Hz.</p>`);
add('CORRENTES','Tensão alternada e valor eficaz',`<p>Quando se diz que uma tomada fornece <b>127 V</b>, o valor mencionado é o <b>valor eficaz</b> da tensão, e não o valor máximo instantâneo.</p><div class="formula sm">U<sub>ef</sub> = U<sub>máx</sub> / √2</div><p>Para uma onda <b>senoidal ideal</b>, isolando o valor máximo:</p>${F('U<sub>máx</sub> = U<sub>ef</sub> · √2') }<p>Exemplo: 127 × 1,414 ≈ <b>180 V</b>. Em 220 V eficazes, o pico é aproximadamente <b>311 V</b>.</p><div class="callout">A relação com √2 é válida para uma senoide ideal; não vale indistintamente para toda forma de onda.</div>`);
add('CORRENTES','Por que transformar tensão?',`<p>A energia elétrica costuma ser transmitida com tensões elevadas e depois adaptada por transformadores às tensões utilizadas pelos consumidores.</p>${P('<h3>Transmissão</h3><p>Tensões elevadas permitem transportar a mesma potência com correntes menores, diminuindo perdas resistivas nas linhas.</p>','<h3>Uso cotidiano</h3><p>Transformadores e fontes adaptam valores de tensão. Equipamentos eletrônicos também podem retificar CA e produzir CC.</p>')}<p class="note">A tensão nominal da tomada não descreve, por si só, quanta energia será consumida por um aparelho.</p>`);
add('EFEITOS','Os quatro efeitos da corrente',`<div class="grid"><div class="panel"><h3>Efeito fisiológico</h3><p>Interação da corrente com tecidos vivos: choque elétrico, contrações musculares e alterações cardíacas.</p></div><div class="panel"><h3>Efeito térmico</h3><p>Aquecimento de condutores por colisões e transferência de energia — efeito Joule.</p></div><div class="panel"><h3>Efeito químico</h3><p>Transformações químicas promovidas pela passagem de corrente: eletrólise e deposição de metais.</p></div><div class="panel"><h3>Efeito magnético</h3><p>Uma corrente cria campo magnético no espaço ao redor do condutor.</p></div></div>`);
add('EFEITOS','Efeito fisiológico · segurança',`<p>A gravidade de um choque depende da <b>corrente que atravessa o corpo</b>, do percurso, do tempo de exposição e de outras condições.</p><div class="grid"><div class="panel"><h3>Consequências possíveis</h3><p>Sensações, contrações involuntárias, queimaduras, arritmias e parada cardíaca.</p></div><div class="panel"><h3>Cuidados essenciais</h3><p>Jamais experimentar corrente da rede elétrica no corpo; evitar contato com fios expostos; usar proteção e manutenção adequadas.</p></div></div><div class="callout">Não existe um único valor de corrente que garanta segurança em todas as situações. Os valores apresentados no livro são referências aproximadas e dependem das condições de exposição.</div>`);
add('EFEITOS','Efeito Joule',`<p>Em um condutor com resistência elétrica, parte da energia fornecida é transformada em energia térmica.</p>${P('<h3>Exemplos</h3><p>Chuveiro elétrico, aquecedor, ferro de passar, torradeira e aquecimento indesejado de cabos.</p>','<h3>Interpretação microscópica</h3><p>O campo elétrico transfere energia às cargas; interações no material transferem energia à rede cristalina.</p>')}<p class="note">A compreensão quantitativa detalhada da potência resistiva será aprofundada quando estudarmos resistência e Lei de Ohm.</p>`);
add('EFEITOS','Efeito químico',`<p>A passagem de corrente por uma solução condutora pode favorecer reações químicas nos eletrodos.</p>${P('<h3>Eletrólise</h3><p>Processos como deposição eletrolítica de metal e decomposição química podem depender de corrente externa.</p>','<h3>Aplicações</h3><p>Galvanoplastia, processos industriais e produção de certas substâncias.</p>')}<p class="callout">Não confunda corrente elétrica com movimento exclusivo de elétrons: no interior da solução, a condução ocorre pelo movimento de íons.</p>`);
add('EFEITOS','Efeito magnético',`<p>Um fio percorrido por corrente elétrica estabelece um campo magnético ao redor dele.</p><svg class="svgbox" viewBox="0 0 900 260"><ellipse cx="455" cy="125" rx="220" ry="90" fill="none" stroke="#4cdeed" stroke-width="4" stroke-dasharray="10 8"/><ellipse cx="455" cy="125" rx="145" ry="57" fill="none" stroke="#4cdeed" stroke-width="4"/><circle cx="455" cy="125" r="27" fill="#132b42" stroke="#ffd166" stroke-width="4"/><circle cx="455" cy="125" r="9" fill="#ffd166"/><text x="495" y="130" class="tlabel">Corrente saindo do plano (•)</text><path d="M590 66 l-18 5 16 13" stroke="#4cdeed" fill="none" stroke-width="5"/><text x="310" y="242" class="tlabel">Linhas de campo em circunferências ao redor do fio</text></svg><p>Uma bússola próxima pode sofrer desvio, revelando a presença do campo magnético.</p>`);
add('APLICAÇÕES','Não confunda grandezas',`<div class="grid3"><div class="panel"><h3>Carga (Q)</h3><div class="formula sm">C</div><p>Quantidade de carga transportada.</p></div><div class="panel"><h3>Corrente (i)</h3><div class="formula sm">A = C/s</div><p>Quantidade de carga por unidade de tempo.</p></div><div class="panel"><h3>Tensão (U)</h3><div class="formula sm">V = J/C</div><p>Energia por unidade de carga.</p></div></div><p class="callout">Uma fonte de alta tensão não fornece necessariamente alta corrente em todas as condições; o circuito e sua resistência também importam.</p>`);
add('APLICAÇÕES','Grandezas e energia elétrica',`<h2>Por que a diferença de potencial importa?</h2><p>A tensão elétrica mede a energia transferida <b>por unidade de carga</b> entre dois pontos.</p>${F('U = |ΔE| / |ΔQ|')}<p>Rearranjando:</p>${F('|ΔE| = U · |ΔQ|')}<p>Se 2 C atravessam um componente sob diferença de potencial de 12 V, a energia transferida tem módulo <b>24 J</b>.</p><p class="tiny">Complemento conceitual, além do foco quantitativo inicial do trecho fornecido do capítulo.</p>`);
add('APLICAÇÕES','Relação entre energia, carga e tempo',`<p>Se uma tensão constante U age sobre corrente constante i por intervalo Δt:</p>${step('Energia: |ΔE| = U·|ΔQ|.','Corrente: |ΔQ| = i·Δt.','Substitua a carga: |ΔE| = U·i·Δt.','Dividindo pelo tempo, a potência elétrica é P = |ΔE|/Δt.','Conclusão: <b>P = U·i</b> para as condições descritas.')} ${F('P = U · i')}<p class="note">A unidade watt é J/s. Essa ampliação conecta o capítulo ao consumo cotidiano de energia.</p>`);
add('EXERCÍCIOS','Exercício · capacidade da bateria',`<h2>Uma bateria armazena 7.000 mAh. Quantos elétrons correspondem à carga indicada?</h2>${step('A unidade mAh representa corrente × tempo: 7.000 mAh = 7 Ah.','Converta horas para segundos: 1 h = 3.600 s.','Q = 7 A × 3.600 s = 25.200 C.','n = Q/e = 25.200 / (1,6×10<sup>−19</sup>).','n = <b>1,575 × 10<sup>23</sup> elétrons</b>.')}<div class="callout">mAh indica capacidade de carga elétrica, não energia em joules ou Wh sem informação adicional de tensão.</div>`);
add('EXERCÍCIOS','Exercício · chuveiro',`<h2>Um chuveiro conduz 45 A durante 10 minutos. Qual a carga que passa pela resistência?</h2>${step('Converta 10 min para 600 s.','Use |ΔQ| = i·Δt.','Substitua os valores: |ΔQ| = 45 × 600.','Resultado: <b>27.000 C = 2,7 × 10<sup>4</sup> C</b>.')}<p class="muted">Adaptação fiel ao exercício 02, página 12.</p>`);
add('EXERCÍCIOS','Exercício · elétrons em um fio',`<h2>Em 3 s passam 15 × 10<sup>21</sup> elétrons. Qual a intensidade média?</h2>${step('Determine a carga: |ΔQ| = n·e.','|ΔQ| = (15×10<sup>21</sup>) × (1,6×10<sup>−19</sup>) C.','Coeficientes: 15×1,6 = 24; potências: 10<sup>21</sup>×10<sup>−19</sup> = 10².','Logo |ΔQ| = 24×10² = 2.400 C.','i = 2.400/3 = <b>800 A</b>.')}<div class="callout">A carga é enorme para um condutor comum: o exercício trabalha cálculo e interpretação de ordens de grandeza.</div>`);
add('EXERCÍCIOS','Desafio conceitual 1',`<h2>O que acontece quando duplicamos i mantendo Δt constante?</h2><div class="question"><button class="choice" onclick="quiz(this,false,'Reveja a expressão |ΔQ| = i·Δt.')">A. A carga transportada cai pela metade.</button><button class="choice" onclick="quiz(this,true,'Correto: |ΔQ| é diretamente proporcional a i para Δt constante.')">B. A carga transportada dobra.</button><button class="choice" onclick="quiz(this,false,'A variação não é quadrática nesta situação.')">C. A carga quadruplica.</button><button class="choice" onclick="quiz(this,false,'A carga depende da intensidade da corrente.')">D. A carga permanece inalterada.</button><div class="feedback"></div></div>`);
add('EXERCÍCIOS','Desafio conceitual 2',`<h2>Em um fio metálico, os elétrons movem-se para a esquerda. Qual é o sentido convencional da corrente?</h2><div class="question"><button class="choice" onclick="quiz(this,false,'Para cargas negativas, a corrente convencional possui sentido oposto ao movimento das cargas.')">A. Para a esquerda.</button><button class="choice" onclick="quiz(this,true,'Correto: em metais, corrente convencional e movimento de elétrons têm sentidos opostos.')">B. Para a direita.</button><button class="choice" onclick="quiz(this,false,'A existência de elétrons móveis permite corrente elétrica.')">C. Não existe corrente.</button><div class="feedback"></div></div>`);
add('EXERCÍCIOS','Desafio conceitual 3',`<h2>Em um gráfico i × t, uma região triangular tem base 8 s e altura 5 A. Qual carga passou?</h2><div class="question"><button class="choice" onclick="quiz(this,false,'40 A·s seria a área de um retângulo de mesma base e altura.')">A. 40 C.</button><button class="choice" onclick="quiz(this,true,'Correto: área triangular = 8×5/2 = 20 C.')">B. 20 C.</button><button class="choice" onclick="quiz(this,false,'Considere as unidades: A·s = C.')">C. 13 C.</button><button class="choice" onclick="quiz(this,false,'Não some base e altura; multiplique e divida por dois.')">D. 6,5 C.</button><div class="feedback"></div></div>`);
add('EXERCÍCIOS','Desafio conceitual 4',`<h2>Qual afirmação descreve corretamente uma corrente contínua?</h2><div class="question"><button class="choice" onclick="quiz(this,false,'Uma corrente contínua pode variar de intensidade sem inverter seu sentido.')">A. Tem intensidade obrigatoriamente constante.</button><button class="choice" onclick="quiz(this,true,'Correto. A característica é a ausência de inversão do sentido da corrente.')">B. Conserva o sentido convencional ao longo do tempo.</button><button class="choice" onclick="quiz(this,false,'A corrente contínua está presente em muitos dispositivos de bateria.')">C. Existe apenas na rede elétrica residencial.</button><div class="feedback"></div></div>`);
add('SÍNTESE','Mapa conceitual',`<div class="grid3"><div class="panel"><h3>Origem</h3><p>Portadores móveis + condições elétricas adequadas + percurso condutor.</p></div><div class="panel"><h3>Quantificação</h3><p>i = |ΔQ|/Δt<br>|ΔQ| = n·e<br>1 A = 1 C/s</p></div><div class="panel"><h3>Representação</h3><p>Sentido convencional e real; gráficos i × t; cálculo de áreas.</p></div><div class="panel"><h3>Regime</h3><p>Corrente contínua ou alternada.</p></div><div class="panel"><h3>Efeitos</h3><p>Fisiológico, térmico, químico e magnético.</p></div><div class="panel"><h3>Aplicação</h3><p>Eletrônicos, tomadas, transporte e transformação de energia.</p></div></div>`);
add('SÍNTESE','Encerramento · três questões essenciais',`<h2>Você consegue explicar?</h2>${step('Por que a lâmpada acende rapidamente, embora os elétrons derivem lentamente?','Como calcular a carga que atravessa uma seção do fio a partir de um gráfico i × t formado por figuras simples?','Por que a direção dos elétrons em um metal é oposta ao sentido convencional da corrente?')}<div class="divider"></div><p class="lead">A eletricidade deixa de ser invisível quando aprendemos a relacionar <span class="cyan">fenômenos</span>, <span class="em">equações</span> e <span class="green">representações gráficas</span>.</p>`);
add('REFERÊNCIA','Fonte e observações',`<h2>Referência didática</h2><p><b>Bernoulli Sistema de Ensino — Física, Frente A, Capítulo 5:</b> “Circuito Elétrico: O Invisível que Movimenta o Mundo Moderno!”, páginas impressas 5–12 (PDF fornecido, 9 páginas).</p><p>O roteiro acompanha: corrente elétrica; circuito, fontes e potencial; sentido de corrente; intensidade; corrente contínua e alternada; efeitos da corrente; e exercícios de aprendizagem.</p><div class="panel"><h3>Aprofundamentos identificados</h3><p>Explicações passo a passo, aplicações de tensão, energia e potência, interpretação detalhada de gráficos e simulações didáticas foram desenvolvidas para esta apresentação. A relação de valor eficaz é válida para ondas senoidais.</p></div><p class="tiny">Material autoral de apoio pedagógico · Professor Madison · sem bibliotecas, imagens ou fontes externas obrigatórias.</p>`);
let idx=0,closed=false;const slide=document.getElementById('slide');function show(n){idx=Math.max(0,Math.min(S.length-1,n));let x=S[idx];slide.innerHTML=`<div class="eyebrow">${x.chapter} · ${idx+1}/${S.length}</div><h2>${x.title}</h2>${x.html}`;slide.scrollTop=0;document.getElementById('count').textContent=`${idx+1} / ${S.length}`;document.getElementById('bar').style.width=`${(idx+1)/S.length*100}%`;document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===S.length-1;if(document.getElementById('iSlider')){document.getElementById('iSlider').oninput=updateCalc;document.getElementById('tSlider').oninput=updateCalc;updateCalc()}if(document.getElementById('graphIslider')){document.getElementById('graphIslider').oninput=updateGraph;document.getElementById('graphTslider').oninput=updateGraph;updateGraph()}if(document.getElementById('acSine')){let arr=[];for(let x=80;x<=820;x+=3){let y=137-82*Math.sin((x-80)/740*Math.PI*4);arr.push((x===80?'M':'L')+x+' '+y.toFixed(1))}document.getElementById('acSine').setAttribute('d',arr.join(' '))}}function updateCalc(){const i=+document.getElementById('iSlider').value,t=+document.getElementById('tSlider').value;document.getElementById('iVal').textContent=i.toLocaleString('pt-BR')+' A';document.getElementById('tVal').textContent=t+' s';document.getElementById('qEq').textContent=`|ΔQ| = ${i.toLocaleString('pt-BR')} × ${t}`;document.getElementById('qVal').textContent=(i*t).toLocaleString('pt-BR')+' C'}function updateGraph(){let i=+document.getElementById('graphIslider').value,t=+document.getElementById('graphTslider').value;document.getElementById('graphI').textContent=i+' A';document.getElementById('graphT').textContent=t+' s';let h=i/10*170,w=t/15*385,r=document.getElementById('barRect');r.setAttribute('y',220-h);r.setAttribute('height',h);r.setAttribute('width',w);document.getElementById('graphFormula').textContent=`Área = ${i} × ${t} = ${i*t} C`}function switchCircuit(){closed=!closed;let el=document.getElementById('switchBlade');el.setAttribute('d',closed?'M330 80 H440':'M330 80 L413 45');document.getElementById('switchBtn').textContent=closed?'Abrir interruptor':'Fechar interruptor';document.getElementById('bulbState').textContent=closed?'Circuito fechado: lâmpada acesa':'Circuito aberto: lâmpada apagada';let bulb=document.querySelector('circle[cx="690"][cy="160"]');bulb.setAttribute('fill',closed?'#705515':'#09172b')}function reveal(id){document.getElementById(id)?.classList.toggle('show')}function quiz(btn,correct,msg){const f=btn.parentElement.querySelector('.feedback');f.textContent=msg;f.style.color=correct?'#63e3b0':'#ffd166';btn.style.borderColor=correct?'#63e3b0':'#ffd166'}document.getElementById('prev').onclick=()=>show(idx-1);document.getElementById('next').onclick=()=>show(idx+1);document.getElementById('menu').onclick=()=>{let list=S.map((x,k)=>`${k+1}. [${x.chapter}] ${x.title}`).join('\n');let n=prompt('Digite o número do slide:\n\n'+list);if(n&&Number.isInteger(+n))show(+n-1)};document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(idx+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)}if(e.key==='Home')show(0);if(e.key==='End')show(S.length-1)});show(0);
