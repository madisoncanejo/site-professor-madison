<meta charset="utf-8">

<title>Caça-Luz — Óptica Geométrica</title>
<style>
:root{--ink:#eef6ff;--gold:#ffca3a;--cyan:#57d7ff;--green:#72e0a4;--danger:#ff6b72}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#02060c;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:grid;place-items:center}
#stage{position:relative;width:min(100vw,calc(100vh*720/820));aspect-ratio:720/820;background:#050b14;overflow:hidden;cursor:crosshair}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#qbar{position:absolute;left:2%;right:2%;top:4.7%;padding:.5em .8em;background:rgba(8,20,36,.93);border:1px solid #2f5a80;border-left:4px solid var(--gold);border-radius:.7em;font-size:1.0em;line-height:1.3;display:none;pointer-events:none}
#qbar small{display:block;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:.64em;margin-bottom:.15em}
#ov{position:absolute;inset:0;display:none;place-items:center;background:rgba(3,8,16,.82);backdrop-filter:blur(3px);padding:3.5%;cursor:default}
#ov.show{display:grid}
.card{width:100%;max-height:100%;overflow:auto;background:linear-gradient(180deg,#12294a,#0b1a2f);border:1px solid #33567c;border-radius:1.1em;padding:1.2em 1.35em;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:left}
.card h1{font-size:2.1em;line-height:1;margin:.1em 0 .25em;letter-spacing:-.03em}
.card h1 span{background:linear-gradient(90deg,#fff,var(--cyan),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.card h2{font-size:1.45em;margin:.1em 0 .4em}
.card h3{margin:.8em 0 .2em;font-size:1em}
.card p{margin:.4em 0;color:#d4e2f2;line-height:1.42}
.kick{color:var(--gold);font-weight:800;font-size:.72em;letter-spacing:.16em;text-transform:uppercase}
.ok{color:var(--green)}.bad{color:var(--danger)}.dim{color:#a9b9ce;font-size:.85em}
.btn{font:inherit;font-weight:800;border-radius:.8em;padding:.65em 1.05em;margin:.3em .3em 0 0;cursor:pointer;background:#173653;color:#fff;border:1px solid #4f7ca4}
.btn.primary{background:linear-gradient(135deg,var(--gold),#f39a29);color:#111923;border:0}
.btn.sel{outline:3px solid var(--cyan)}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.4em .8em;font-size:.88em;margin:.5em 0}
.stg{display:grid;grid-template-columns:repeat(4,1fr);gap:.4em;margin:.4em 0}
.stg button{margin:0;padding:.5em .2em;font-size:.85em;line-height:1.25;text-align:center}
.stg small{display:block;font-weight:600;font-size:.72em;opacity:.85}
.miss{border-left:3px solid var(--danger);background:#0a1a2b;border-radius:.5em;padding:.5em .7em;margin:.5em 0;font-size:.84em}
.miss b{color:var(--gold)}
.key{border:1px solid #4f7ca4;border-radius:.35em;padding:0 .4em;background:#0a1a2b;font-size:.85em}
.stars{font-size:2em;letter-spacing:.1em;color:var(--gold)}
.tb{position:absolute;top:.8%;z-index:5;background:rgba(8,20,36,.7);border:1px solid #33567c;color:#fff;border-radius:.6em;font-size:.85em;padding:.2em .5em;cursor:pointer}
#mute{right:1.5%}#fs{right:9%}
#lamps{position:absolute;left:0;right:0;bottom:10%;display:none;justify-content:center;gap:1.4em;z-index:6}
.lamp{width:5em;height:5em;border-radius:50%;border:3px solid #fff5;color:#fff;font-weight:900;font-size:1em;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:.55;cursor:pointer;touch-action:none}
.lamp small{font-size:.6em;font-weight:600}
.lamp.on{opacity:1;box-shadow:0 0 26px currentColor;border-color:#fff}
#lr{background:#c81e2b;color:#ff6b72}#lg{background:#12984a;color:#72e0a4}#lb{background:#2447d6;color:#6e8cff}
.lamp span{color:#fff}
</style>

<script>
'use strict';
const MODE='A';const VEST=MODE==='B';
document.title=VEST?'Caça-Luz — Revisão Vestibular (Óptica Geométrica)':'Caça-Luz — Missão Óptica (Óptica Geométrica)';

/* ====== BANCOS DE ITENS (rodadas de classificação) ====== */
const BANKS={
 fonte:{names:{lum:'corpo LUMINOSO (fonte primária: emite luz própria)',ilu:'corpo ILUMINADO (fonte secundária: só reenvia luz)'},
  goals:{lum:'Corpos LUMINOSOS (emitem luz própria)',ilu:'Corpos ILUMINADOS (só reenviam a luz recebida)'},
  items:[['☀️','Sol','lum'],['⭐','Estrela','lum'],['🕯️','Vela acesa','lum'],['💡','Lâmpada acesa','lum'],['🔦','Lanterna acesa','lum'],['🌙','Lua','ilu'],['🧱','Parede','ilu'],['👕','Roupa','ilu'],['🪞','Espelho','ilu'],['📖','Livro','ilu'],['🪐','Planeta','ilu'],['🗽','Estátua','ilu']]},
 meio:{names:{tra:'meio TRANSPARENTE (visão nítida)',tns:'meio TRANSLÚCIDO (a luz passa, sem nitidez)',opa:'meio OPACO (não deixa a luz passar)'},
  goals:{tra:'Meios TRANSPARENTES',tns:'Meios TRANSLÚCIDOS',opa:'Meios OPACOS'},
  items:[['🪟','Vidro comum','tra'],['🌬️','Ar','tra'],['💧','Água (fina camada)','tra'],['🧊','Vidro fosco','tns'],['📜','Papel vegetal','tns'],['🗒️','Papel de seda','tns'],['🪵','Madeira','opa'],['🏗️','Concreto','opa'],['🔩','Metal','opa'],['🧱','Tijolo','opa']]},
 fenom:{names:{rr:'reflexão REGULAR (superfície plana e polida)',rd:'reflexão DIFUSA (superfície irregular)',rf:'REFRAÇÃO (a luz passa a outro meio)',ab:'ABSORÇÃO (a energia luminosa é absorvida)'},
  goals:{rr:'REFLEXÃO REGULAR',rd:'REFLEXÃO DIFUSA',rf:'REFRAÇÃO',ab:'ABSORÇÃO'},
  items:[['🪞','Espelho plano','rr'],['🥄','Metal polido','rr'],['🧱','Parede fosca','rd'],['📄','Folha de papel','rd'],['👕','Camisa branca','rd'],['🏊','Luz entrando na água','rf'],['🔍','Lente de vidro','rf'],['🔺','Prisma de vidro','rf'],['⬛','Corpo negro','ab'],['🛣️','Asfalto escuro','ab']]},
 cor:{names:{mono:'luz MONOCROMÁTICA (uma só cor)',poli:'luz POLICROMÁTICA (mistura de cores)'},
  goals:{mono:'Luz MONOCROMÁTICA (uma só cor)',poli:'Luz POLICROMÁTICA (mistura de cores)'},
  items:[['🟡','Lâmpada de sódio','mono'],['🔴','Laser vermelho','mono'],['🟢','Laser verde','mono'],['☀️','Luz do Sol','poli'],['💡','Lâmpada incandescente','poli'],['🔆','Lâmpada branca','poli'],['⚪','Luz branca','poli']]},
 princ:{names:{ret:'propagação RETILÍNEA da luz',rev:'REVERSIBILIDADE dos raios',ind:'INDEPENDÊNCIA dos raios'},
  goals:{ret:'Exemplos de PROPAGAÇÃO RETILÍNEA',rev:'Exemplos de REVERSIBILIDADE dos raios',ind:'Exemplos de INDEPENDÊNCIA dos raios'},
  items:[['🌑','Sombra nítida','ret'],['📦','Câmara escura','ret'],['🌘','Eclipse','ret'],['🌫️','Feixe reto na fumaça','ret'],['🚗','Retrovisor','rev'],['👀','Se A vê B, B vê A','rev'],['↩️','Raio: ida e volta','rev'],['🎭','Holofotes cruzados','ind'],['✴️','Dois lasers se cruzam','ind'],['🌈','Feixes cruzados','ind']]}
};

/* ====== PERGUNTAS — VERSÃO A (baseadas no texto do capítulo) ====== */
const QA=[],QV=[];
const QaA=(s,t,q,ok,bad,ex)=>QA.push({s,t,q,ok,bad,ex});
// 0 · Fontes de luz
QaA(0,1,'O que é um raio de luz?','Linha orientada que representa a direção e o sentido de propagação da luz',['Um feixe colorido de luz','A energia transportada pela luz','A velocidade da luz no vácuo'],'Raios de luz são linhas orientadas; um conjunto deles forma um feixe (convergente, divergente ou paralelo).');
QaA(0,1,'Um feixe cujos raios se afastam a partir de um ponto é:','Divergente',['Convergente','Paralelo','Monocromático'],'Feixes de luz podem ser convergentes, divergentes ou paralelos.');
QaA(0,1,'A Lua é um corpo:','Iluminado (fonte secundária)',['Luminoso (fonte primária)','Pontual','Monocromático'],'A Lua apenas reenvia a luz recebida do Sol.');
QaA(0,2,'Uma estrela muito distante pode ser considerada:','Fonte pontual',['Fonte extensa','Corpo iluminado','Fonte secundária'],'Se as dimensões da fonte são desprezíveis frente às distâncias, ela é pontual. O Sol, por estar mais perto, é fonte extensa.');
QaA(0,2,'A luz branca do Sol é:','Policromática: superposição de luzes de várias cores',['Monocromática','De cor amarela pura','Uma luz sem cores'],'Um prisma separa as luzes monocromáticas que compõem a luz branca.');
QaA(0,2,'No vácuo, a velocidade de propagação da luz é aproximadamente:','300 000 km/s',['30 000 km/s','3 000 000 km/s','300 km/s'],'Qualquer luz monocromática tem a mesma velocidade no vácuo; em meios materiais é menor.');
QaA(0,3,'Um ano-luz é uma unidade de:','Distância (cerca de 9,5×10¹² km)',['Tempo','Velocidade','Luminosidade'],'É a distância que a luz percorre no vácuo em um ano.');
QaA(0,3,'Uma estrela está a 15 anos-luz. Essa distância, em km, vale cerca de:','1,4×10¹⁴ km',['1,4×10¹² km','9,5×10¹² km','1,4×10¹⁶ km'],'15 × 9,5×10¹² ≈ 1,4×10¹⁴ km.');
QaA(0,3,'A luz de uma estrela a 1 bilhão de anos-luz que recebemos hoje foi emitida:','Há 1 bilhão de anos',['Ontem','Há 1 bilhão de km','Há 1 ano'],'Vemos a estrela como ela era quando a luz partiu.');
QaA(0,3,'Roemer estimou a velocidade da luz observando eclipses de Io. Com Δt = 1 000 s para atravessar 3×10⁸ km, obtém-se:','300 000 km/s',['3 000 km/s','30 000 km/s','3 000 000 km/s'],'v = Δs/Δt = 3×10⁸ km / 1 000 s = 3×10⁵ km/s.');
QaA(0,3,'Se o Sol "se apagasse" de repente, 24 h depois, no céu noturno sem nuvens, ainda veríamos:','Somente estrelas',['A Lua e as estrelas','Somente a Lua','Nada'],'Lua e planetas são corpos iluminados: só brilham refletindo a luz do Sol.');
// 1 · Meios e fenômenos
QaA(1,1,'O papel vegetal é um meio:','Translúcido',['Transparente','Opaco','Luminoso'],'Meios translúcidos deixam passar a luz, mas sem permitir visão nítida.');
QaA(1,1,'Vidro comum, ar e água em pequenas camadas são meios:','Transparentes',['Opacos','Translúcidos','Luminosos'],'Neles vemos os objetos com nitidez.');
QaA(1,1,'Madeira e concreto são meios:','Opacos',['Transparentes','Translúcidos','Refratores'],'Meios opacos não permitem a propagação da luz.');
QaA(1,2,'Ao atravessar um meio translúcido, os raios paralelos:','Seguem trajetórias irregulares (a visão perde a nitidez)',['Continuam paralelos','São totalmente absorvidos','Mudam de cor'],'Nos meios transparentes as trajetórias são regulares; nos translúcidos, irregulares.');
QaA(1,2,'A reflexão regular ocorre, por exemplo, em:','Uma superfície plana e polida (espelho)',['Uma parede rugosa','Um papel amassado','Um corpo negro'],'Raios paralelos incidentes continuam paralelos após a reflexão regular.');
QaA(1,2,'Vemos uma parede porque ela:','Reflete a luz de modo difuso, em todas as direções',['Emite luz própria','Absorve toda a luz','Reflete a luz regularmente'],'A difusão ocorre por causa das irregularidades da superfície.');
QaA(1,2,'Na miopia, a imagem se forma:','Antes da retina (olho mais alongado)',['Depois da retina','Exatamente na retina','Na córnea'],'Na hipermetropia é o contrário: olho mais curto, imagem depois da retina.');
QaA(1,3,'Reflexão, refração e absorção:','Podem ocorrer simultaneamente, com intensidades diferentes',['Nunca ocorrem juntas','Só ocorrem em espelhos','Só ocorrem no vácuo'],'Em um corpo preto predomina a absorção; em um branco, a difusão; num metal polido, a reflexão regular.');
QaA(1,3,'Se não existisse a reflexão difusa, veríamos:','Apenas os corpos luminosos',['Todos os corpos normalmente','Somente os espelhos','Nada, nem o Sol'],'Corpos iluminados só são vistos porque difundem a luz que recebem.');
QaA(1,3,'Quando a luz passa do ar para a água lisa de uma piscina, ocorre:','Refração regular (por isso vemos o fundo)',['Absorção total','Reflexão difusa','Reflexão regular apenas'],'A luz atravessa a superfície e passa a se propagar no outro meio.');
// 2 · Cores
QaA(2,1,'As cores primárias da luz são:','Vermelho, verde e azul',['Amarelo, ciano e magenta','Vermelho, amarelo e azul','Branco, preto e cinza'],'Amarelo, magenta e ciano são as cores secundárias.');
QaA(2,1,'Vermelho + verde (luz) produz:','Amarelo',['Magenta','Ciano','Branco'],'Vermelho + azul = magenta; verde + azul = ciano; as três = branco.');
QaA(2,1,'Vermelho + verde + azul (luz, mesma intensidade) produz:','Branco',['Preto','Cinza','Amarelo'],'Superpondo as três primárias obtém-se luz branca.');
QaA(2,2,'Cores complementares (juntas formam branco) são:','Amarelo e azul',['Vermelho e verde','Azul e ciano','Magenta e vermelho'],'Também são complementares: ciano e vermelho; magenta e verde.');
QaA(2,2,'Um corpo azul, sob luz branca, parece azul porque:','Reflete difusamente a luz azul e absorve as demais',['Emite luz azul','Absorve a luz azul','Reflete todas as cores'],'A cor por reflexão é determinada pela luz refletida difusamente.');
QaA(2,2,'O céu é azul porque, na atmosfera:','As componentes de menor comprimento de onda (violeta e azul) são mais difundidas',['A luz vermelha é mais difundida','O ar é azul','O oceano reflete o céu'],'Por isso a luz difundida chega aos nossos olhos com predomínio de azul.');
QaA(2,2,'O Sol e o céu ficam avermelhados no nascer e no pôr do sol porque:','A luz atravessa uma camada maior de atmosfera e o azul é difundido pelo caminho',['O Sol esfria ao anoitecer','A Terra absorve o azul','As nuvens emitem luz vermelha'],'Sobra a componente vermelha, menos difundida.');
QaA(2,2,'As nuvens são brancas porque:','As gotas, de vários tamanhos, difundem todas as componentes da luz solar',['Absorvem todas as cores','Refletem só o azul','Emitem luz branca'],'A soma de todas as cores difundidas resulta em branco.');
QaA(2,3,'Um disco branco e um disco azul são iluminados por luz vermelha. Eles parecem, respectivamente:','Vermelho e preto',['Branco e azul','Vermelho e azul','Preto e vermelho'],'O branco difunde o vermelho; o azul absorve o vermelho e parece preto.');
QaA(2,3,'Um corpo verde, iluminado só por luz monocromática vermelha, parece:','Preto',['Verde','Vermelho','Branco'],'Ele só reflete o verde, que não existe na luz incidente.');
QaA(2,3,'A Lua fica avermelhada num eclipse lunar total porque:','A atmosfera terrestre desvia para a Lua a luz vermelha (o azul é difundido)',['A Lua esquenta','A Terra emite luz vermelha','A Lua emite luz própria'],'As cores azul, anil e violeta são mais difundidas que a vermelha.');
// 3 · Sombra e penumbra
QaA(3,1,'O princípio da propagação retilínea diz que, em meios homogêneos e transparentes, a luz:','Se propaga em linha reta',['Se propaga em curvas','Se propaga só no vácuo','Não se propaga'],'A semelhança geométrica entre sombra e objeto evidencia esse princípio.');
QaA(3,1,'A região que não recebe luz da fonte é a:','Sombra',['Penumbra','Área iluminada','Refração'],'Sombra: nenhuma luz da fonte chega. Penumbra: chega luz de parte da fonte.');
QaA(3,2,'Com uma fonte extensa, a região iluminada apenas por parte da fonte é a:','Penumbra',['Sombra','Região totalmente iluminada','Região refratada'],'Somente alguns pontos da fonte iluminam a penumbra.');
QaA(3,2,'Uma fonte pontual, iluminando um obstáculo opaco, produz:','Sombra nítida, sem penumbra',['Sombra e penumbra','Só penumbra','Nenhuma sombra'],'A penumbra só aparece com fontes extensas.');
QaA(3,2,'Quanto mais próximo o objeto está do anteparo, a sombra fica:','Mais nítida',['Mais borrada','Maior','Desaparece'],'Como nas fotos da girafa: perto do anteparo a sombra é mais definida.');
QaA(3,3,'Uma placa quadrada de 10 cm de lado está a 1,0 m de uma fonte pontual e 2,0 m do anteparo (além da placa). A área da sombra é:','900 cm²',['100 cm²','300 cm²','200 cm²'],'A sombra tem lado 10 × (3/1) = 30 cm; área = 900 cm².');
QaA(3,3,'A penumbra que se vê na sombra de um pilar deve-se:','Ao fato de a fonte de luz não ser pontual',['À difração','À refração no ar','À absorção do pilar'],'Fonte extensa ⇒ sombra e penumbra.');
QaA(3,3,'Um muro de 2 m projeta sombra de 60 cm. No mesmo instante, um prédio projeta sombra de 15 m. Altura do prédio:','50 m',['30 m','45 m','18 m'],'Triângulos semelhantes: H/2 = 15/0,6 ⇒ H = 50 m.');
// 4 · Eclipses
QaA(4,1,'O eclipse solar ocorre quando:','A Lua se interpõe entre o Sol e a Terra (sombra ou penumbra da Lua atinge a Terra)',['A Terra fica entre o Sol e a Lua','O Sol se apaga','A Lua fica atrás do Sol'],'Sombra e penumbra da Lua interceptam a superfície terrestre.');
QaA(4,1,'O eclipse lunar ocorre quando:','A Lua penetra a região de sombra da Terra',['A Lua passa entre Terra e Sol','A Terra entra na sombra do Sol','A Lua entra na penumbra do Sol'],'A Terra fica entre o Sol e a Lua.');
QaA(4,2,'Quem está na região de sombra da Lua vê:','Um eclipse solar total',['Um eclipse parcial','Um eclipse lunar','Nenhum eclipse'],'O Sol é totalmente encoberto; só resta a coroa solar visível.');
QaA(4,2,'Quem está na região de penumbra da Lua vê:','Um eclipse solar parcial',['Um eclipse total','Um eclipse anular','Nenhum eclipse'],'Parte do Sol fica encoberta.');
QaA(4,2,'O eclipse anular do Sol ocorre quando:','O prolongamento do cone de sombra da Lua intercepta a Terra e se vê um anel solar',['A Lua está em quarto crescente','A Terra está no periélio','O Sol está no zênite'],'A Lua encobre a parte central do Sol, e resta um anel luminoso.');
QaA(4,3,'No eclipse solar total, Sol, Lua e Terra atuam, respectivamente, como:','Fonte, obstáculo e anteparo',['Obstáculo, fonte e anteparo','Anteparo, fonte e obstáculo','Fonte, anteparo e obstáculo'],'A Lua bloqueia a luz do Sol e a sombra se projeta na Terra.');
QaA(4,3,'Eclipses totais da Lua se repetem a cada ~18 anos em um mesmo ponto da Terra. O fenômeno evidencia:','A propagação retilínea da luz',['A refração da luz','A independência dos raios','A absorção da luz'],'As sombras se formam porque a luz segue em linha reta.');
// 5 · Câmara escura / ângulo visual
QaA(5,1,'A imagem formada numa câmara escura de orifício é:','Invertida (cima↔baixo e direita↔esquerda)',['Direita e do mesmo tamanho','Direita e ampliada','Invisível'],'Os raios que passam pelo orifício se cruzam.');
QaA(5,1,'Na câmara escura, a relação m/n = a/b vem:','Da semelhança dos triângulos formados pelo objeto e pela imagem',['Da refração','Da absorção','Da difração'],'m = altura do objeto, n = altura da imagem, a = distância objeto–orifício, b = comprimento da câmara.');
QaA(5,2,'Aumentar o diâmetro do orifício da câmara escura:','Aumenta a luminosidade, mas diminui a nitidez',['Aumenta a nitidez','Não muda nada','Inverte a imagem'],'Cada ponto do objeto passa a corresponder a uma mancha luminosa.');
QaA(5,2,'Quanto maior a distância do objeto ao observador, o ângulo visual é:','Menor',['Maior','Igual','Nulo'],'Por isso objetos distantes parecem menores.');
QaA(5,2,'O Sol e a Lua são vistos da Terra sob um ângulo visual da ordem de:','Meio grau',['30 graus','5 graus','1 segundo'],'Por isso a Lua consegue encobrir o Sol num eclipse.');
QaA(5,3,'O limite de acuidade visual do olho humano é da ordem de:','1 minuto (de arco)',['1 grau','1 hora','10 graus'],'É o menor ângulo visual sob o qual o observador vê dois pontos separados.');

/* ====== GERADORES DE PROBLEMAS (com diagrama) ====== */
const nf=(x,d=2)=>(+x.toFixed(d)).toLocaleString('pt-BR',{maximumFractionDigits:d});
function uniqOpts(ok,cands,fmt){
  const seen=new Set([fmt(ok)]),out=[];
  for(const c of cands){if(c>0&&isFinite(c)&&!seen.has(fmt(c))){seen.add(fmt(c));out.push(fmt(c));if(out.length===3)break}}
  let k=1.3;while(out.length<3){const v=ok*k;k+=.4;if(!seen.has(fmt(v))){seen.add(fmt(v));out.push(fmt(v))}}
  return out;
}
const pick2=a=>a[Math.floor(Math.random()*a.length)];
const GEN={
 shadow(){
  const h=pick2([0.5,1,1.5,2]),s=pick2([0.4,0.5,0.8,1]),k=pick2([10,15,20,25,30,50]);
  const S=+(s*k).toFixed(2),H=+(h*k).toFixed(2),f=x=>nf(x)+' m';
  return{s:3,t:3,src:'Problema gerado',q:`No mesmo instante, uma haste vertical de ${nf(h)} m projeta sombra de ${nf(s)} m e um prédio projeta sombra de ${nf(S)} m. Qual é a altura do prédio?`,
   ok:f(H),bad:uniqOpts(H,[H/2,H*2,H+S-s,h*S,S-s],f),ex:`Raios solares paralelos formam triângulos semelhantes: H/h = S/s ⇒ H = ${nf(h)} · ${nf(S)} / ${nf(s)} = ${nf(H)} m.`,
   draw:{k:'shadow',h,s,S}};
 },
 cam(){
  const T=pick2([[8,40,25,5],[10,40,20,5],[20,40,10,5],[12,30,10,4],[6,20,10,3],[15,30,10,5],[10,20,4,2],[4,20,10,2]]);
  const [a,b,n,m]=T,ask=pick2(['n','a','m']);
  let q,ok,cands,fmt,ex;
  if(ask==='n'){fmt=x=>nf(x)+' cm';ok=n;cands=[m*a/b*100,n*2,n/2,b*a/m];q=`Uma árvore de ${nf(m)} m está a ${nf(a)} m do orifício de uma câmara escura de ${nf(b)} cm de comprimento. Qual a altura da imagem?`;ex=`m/n = a/b ⇒ n = m·b/a = ${nf(m)}·${nf(b)}/${nf(a)} m·cm/m = ${nf(n)} cm.`}
  else if(ask==='a'){fmt=x=>nf(x)+' m';ok=a;cands=[a*2,a/2,m*b/n/2,b*n/m];q=`Numa câmara escura de ${nf(b)} cm de comprimento, um objeto de ${nf(m)} m produz imagem de ${nf(n)} cm. A que distância do orifício está o objeto?`;ex=`m/n = a/b ⇒ a = m·b/n = ${nf(a)} m.`}
  else{fmt=x=>nf(x)+' m';ok=m;cands=[m*2,m/2,n*a/b,m+1];q=`Uma câmara escura de ${nf(b)} cm forma imagem de ${nf(n)} cm de um objeto a ${nf(a)} m do orifício. Qual a altura do objeto?`;ex=`m = n·a/b = ${nf(n)}·${nf(a)}/${nf(b)} = ${nf(m)} m.`}
  return{s:5,t:3,src:'Problema gerado',q,ok:fmt(ok),bad:uniqOpts(ok,cands,fmt),ex,draw:{k:'cam',a,b,n,m,ask}};
 },
 point(){
  const l=pick2([10,20]),d1=pick2([0.5,1,2]),f2=pick2([1,2,3]),d2=d1*f2,r=(d1+d2)/d1,side=l*r,ask=pick2(['side','area']);
  const fmt=ask==='side'?(x=>nf(x)+' cm'):(x=>nf(x)+' cm²'),ok=ask==='side'?side:side*side;
  const cands=ask==='side'?[l*d2/d1,l*r*r,l*(r+1),l*d2]:[side*2,l*l*r,l*l*(r+1),(l*r)*(l*r)*2];
  return{s:3,t:3,src:'Problema gerado',q:`Uma placa quadrada de ${nf(l)} cm de lado está a ${nf(d1)} m de uma fonte pontual e a ${nf(d2)} m do anteparo (além da placa). ${ask==='side'?'Qual o lado':'Qual a área'} da sombra no anteparo?`,
   ok:fmt(ok),bad:uniqOpts(ok,cands,fmt),ex:`Distância fonte–anteparo: ${nf(d1+d2)} m. Fator de ampliação = ${nf(r)} ⇒ lado da sombra = ${nf(side)} cm${ask==='area'?`, área = ${nf(side*side)} cm²`:''}.`,
   draw:{k:'point',l,d1,d2}};
 }
};

let ac=null;
function tone(f,d,type='square',vol=.05,slide=0){
  if(muted)return;try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+d);
    gn.gain.setValueAtTime(vol,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(gn).connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}

/* ---- perguntas de múltipla escolha ---- */
function pickQ(d){
  if(d.gen)return GEN[d.gen]();
  const st=STAGES[g.stage],U=g.used;let pool;
  const fin=!!st.final;
  const f1=q=>!U.has(q)&&(fin?q.t>=3:(q.s===g.stage&&q.t===d.t));
  const f2=q=>!U.has(q)&&(fin?q.t>=2:q.s===g.stage);
  pool=QS.filter(f1);if(!pool.length)pool=QS.filter(f2);
  if(!pool.length)pool=QS.filter(q=>!U.has(q)&&q.t>=d.t);
  if(!pool.length){U.clear();pool=QS.filter(q=>fin?q.t>=3:q.s===g.stage)}
  const q=pick(pool);U.add(q);return q;
}
function resolveQuiz(b,timeout){
  const rd=g.rd;if(state!=='round'||rd.fin)return;
  state='feedback';rd.fin=true;const q=rd.q,ok=!!(b&&b.ok);

  else{hurt(1,`${q.q} → ${q.ok}`);sfx.no();if(b)burst(b.x+b.w/2,b.y+b.h/2,'#ff6b72',30,200)}
  hideQ();

    <p><b>Resposta certa:</b> ${esc(q.ok)}</p><p>${esc(q.ex)}</p>

}

const LCSS={0:'#15181f',1:'#ff3b3b',2:'#30d060',4:'#3b6bff',3:'#ffe03b',5:'#ff3bd0',6:'#3bf0ff',7:'#ffffff'};
const LNAME={0:'nenhuma',1:'vermelha',2:'verde',4:'azul',3:'amarela',5:'magenta',6:'ciano',7:'branca'};
const ONAME={0:'preto',1:'vermelho',2:'verde',4:'azul',3:'amarelo',5:'magenta',6:'ciano',7:'branco'};
const OPLUR={0:'PRETOS',1:'VERMELHOS',2:'VERDES',4:'AZUIS',3:'AMARELOS',5:'MAGENTA',6:'CIANO',7:'BRANCOS'};
const strip=h=>h.replace(/<[^>]+>/g,'');

function buildRound(d){
  const D=DIFFS[diff],L=g.L,base={boss:!!d.boss,mist:0,fin:false};
  let rd;
  if(d.k==='cls')rd=buildCls(d,base,D,L);
  else if(d.k==='pred')rd=buildPred(d,base,D,L);
  else if(d.k==='make')rd=buildMake(d,base,D,L);
  else if(d.k==='region')rd=buildRegion(d,base,D,L);
  else rd=buildQuiz(d,base,D,L);
  rd.t=rd.tmax;return rd;
}
function layoutRails(items,L){
  const rows=items.length>8?4:3,ys=rows===4?[235,350,465,580]:[250,390,530];
  items.forEach((it,i)=>{const r=i%rows,dir=r%2?-1:1;it.y=ys[r];it.vx=dir*(42+L*13+rnd(0,18));it.x=rnd(60,W-60)+i*13;it.w=98;it.h=106;it.dead=false;it.flash=0});
  // separa itens da mesma trilha
  for(let r=0;r<rows;r++){const row=items.filter((_,i)=>i%rows===r);row.forEach((it,k)=>{it.x=(k+.5)*(W/row.length)+rnd(-20,20)})}
}
function buildCls(d,base,D,L){
  const B=BANKS[d.b],goal=d.g||pick(Object.keys(B.goals));
  const okAll=B.items.filter(i=>i[2]===goal),noAll=B.items.filter(i=>i[2]!==goal);
  const nOk=Math.min(okAll.length,3+(L>=4?1:0)),nNo=Math.min(noAll.length,3+Math.floor(L/2));
  const items=shuffle([...shuffle(okAll).slice(0,nOk),...shuffle(noAll).slice(0,nNo)]).map(i=>({emoji:i[0],label:i[1],ok:i[2]===goal,why:`${i[1]}: ${B.names[i[2]]}.`}));
  layoutRails(items,L);
  const prompt=`Atire só nos alvos que são: <b>${B.goals[goal]}</b>`;
  return Object.assign(base,{type:'cls',label:'Classificação',prompt,plain:strip(prompt),items,tmax:Math.max(12,28-L*1.5)*D.time*(base.boss?.85:1)});
}
function buildPred(d,base,D,L){
  const lights=L<2?[1,2,4]:[1,2,4,3,5,6];let lamp,goal,items;
  for(let tries=0;tries<50;tries++){
    lamp=pick(lights);const cnt={};[0,1,2,3,4,5,6,7].forEach(b=>{const p=lamp&b;cnt[p]=(cnt[p]||0)+1});
    const goals=Object.keys(cnt).filter(k=>cnt[k]>=2&&cnt[k]<=4).map(Number);
    if(goals.length){goal=pick(goals);break}
  }
  items=shuffle([0,1,2,3,4,5,6,7]).map(b=>{const p=lamp&b;return{body:b,label:ONAME[b],ok:p===goal,
    why:`Sob luz ${LNAME[lamp]}, o objeto ${ONAME[b]} fica ${ONAME[p]}.`}});
  layoutRails(items,L);items.forEach(it=>{it.w=92;it.h=100});
  const prompt=`Sob luz <b style="color:${LCSS[lamp]}">${LNAME[lamp].toUpperCase()}</b>, atire nos objetos que ficarão <b>${OPLUR[goal]}</b>`;
  return Object.assign(base,{type:'cls',variant:'pred',label:'Cor dos corpos',prompt,plain:strip(prompt),items,lamp,tmax:Math.max(14,30-L*1.5)*D.time*(base.boss?.85:1)});
}
function buildMake(d,base,D,L){

const makePrompt=a=>`Ligue as lâmpadas para produzir a luz <b>${a.name}</b> e atire no anteparo${/compl/.test(a.name)?' (juntas, as duas dariam luz branca)':''}`;

/* ---- região (sombra, penumbra, eclipses) ---- */
const YC=400,REGN={
 lab:{umb:'SOMBRA (não recebe luz da fonte)',pen:'PENUMBRA (recebe luz de parte da fonte)',lit:'região totalmente ILUMINADA'},
 solar:{umb:'sombra da Lua → eclipse solar TOTAL',pen:'penumbra da Lua → eclipse solar PARCIAL',lit:'fora da sombra e da penumbra → sem eclipse'},
 lunar:{umb:'sombra da Terra → eclipse lunar TOTAL',pen:'penumbra da Terra → Lua pouco escurecida',lit:'Lua plenamente iluminada → sem eclipse'}};
function buildRegion(d,base,D,L){
  const th=d.th;let P;
  if(th==='lab'){const pont=Math.random()<.35;P={s:pont?0:pick([40,50]),h:pick([50,60]),x0:110,x1:380,x2:560,src:pont?'Fonte puntiforme':'Fonte extensa',occ:'Obstáculo',scr:'Anteparo'}}
  else if(th==='solar')P={s:60,h:30,x0:100,x1:440,x2:590,src:'Sol',occ:'Lua',scr:'Terra'};
  else P={s:60,h:46,x0:100,x1:330,x2:590,src:'Sol',occ:'Terra',scr:'Órbita da Lua'};
  const k=(P.x2-P.x0)/(P.x1-P.x0);P.U=Math.max(0,P.s+(P.h-P.s)*k);P.P=-P.s+(P.h+P.s)*k;P.hasPen=P.P>P.U+3;
  const regs=['umb',...(P.hasPen?['pen']:[]),'lit'],target=pick(regs);
  const letters=shuffle(['A','B','C','D']).slice(0,regs.length);
  const sg=()=>Math.random()<.5?-1:1;
  const markers=regs.map((r,i)=>{let y;
    if(r==='umb')y=rnd(-.55,.55)*P.U;else if(r==='pen')y=sg()*(P.U+(P.P-P.U)*rnd(.3,.7));else y=sg()*(P.P+(215-P.P)*rnd(.3,.7));
    return{r,y,letter:letters[i],flash:0,dead:false}});
  const N=REGN[th];let prompt;
  if(th==='lab')prompt=P.s?`Fonte extensa: atire no ponto do anteparo que está ${target==='umb'?'na <b>SOMBRA</b>':target==='pen'?'na <b>PENUMBRA</b>':'<b>totalmente iluminado</b>'}`:`Fonte puntiforme: atire no ponto do anteparo que está ${target==='umb'?'na <b>SOMBRA</b>':'<b>iluminado</b>'}`;
  else if(th==='solar')prompt=target==='umb'?'Em qual ponto da Terra o observador vê um eclipse solar <b>TOTAL</b>?':target==='pen'?'Em qual ponto o observador vê um eclipse solar <b>PARCIAL</b>?':'Em qual ponto <b>não há eclipse</b> do Sol?';
  else prompt=target==='umb'?'Em qual posição a Lua sofre <b>eclipse lunar total</b> (na sombra da Terra)?':target==='pen'?'Em qual posição a Lua está na <b>penumbra</b> da Terra?':'Em qual posição a Lua <b>não sofre eclipse</b>?';
  return Object.assign(base,{type:'region',th,P,markers,target,wrong:0,label:th==='lab'?'Sombra e penumbra':'Eclipses',prompt,plain:strip(prompt),names:N,tmax:Math.max(14,26-L)*D.time*(base.boss?.85:1)});
}
/* ---- pergunta de múltipla escolha ---- */
function buildQuiz(d,base,D,L){

  const w=328,h=hasD?112:140,xs=[18,374],ys=hasD?[430,556]:[280,440];
  const bubbles=opts.map((o,i)=>({x:xs[i%2],y:ys[Math.floor(i/2)],w,h,ox:0,text:o.t,ok:o.ok,flash:0,ph:rnd(0,6),sp:rnd(.7,1.3),amp:6+L*2,dead:false}));

/* ============================ TIRO E COLISÃO ============================ */

function itemAt(x,y){const it=g.rd.items;for(let i=it.length-1;i>=0;i--){const a=it[i];if(!a.dead&&Math.abs(x-a.x)<a.w/2&&Math.abs(y-a.y)<a.h/2)return a}return null}

      if(!rd.items.some(a=>a.ok&&!a.dead))setTimeout(()=>{if(g.rd===rd)finishRound(true)},350)}
    else{it.flash=.7;rd.mist++;say('✖ '+it.why,'#ff6b72',3.2);hurt(1,`${rd.plain} → ${it.why}`);burst(it.x,it.y,'#ff6b72',16,160)}
  }else if(rd.type==='make'){
    const s=rd.scr;if(x<s.x||x>s.x+s.w||y<s.y||y>s.y+s.h)return;

    const a=rd.asks[rd.ai];
    if(g.lamps===a.need){rd.ai++;g.combo++;addScore(120,x,y);burst(x,y,LCSS[g.lamps],30,240);sfx.ok();say(`✔ Luz ${LNAME[g.lamps]} = ${['','vermelha','verde','vermelha+verde','azul','vermelha+azul','verde+azul','vermelha+verde+azul'][g.lamps]}`,'#72e0a4',3);
      if(rd.ai>=rd.asks.length)setTimeout(()=>{if(g.rd===rd)finishRound(true)},450);else{rd.prompt=makePrompt(rd.asks[rd.ai]);const p=document.getElementById('ptxt');if(p)p.innerHTML=rd.prompt}}

    const P=rd.P;for(const m of rd.markers){

        else{m.flash=.8;rd.mist++;rd.wrong++;const t=`Ponto ${m.letter}: ${rd.names[m.r]}.`;say('✖ '+t,'#ff6b72',3.4);hurt(1,`${rd.plain} → ${t}`);
          if(rd.wrong>=3&&!rd.fin)setTimeout(()=>{if(g.rd===rd)finishRound(false)},700)}

  }else if(rd.type==='quiz'){

}
const L4=()=>g.L*4;
function syncLamps(){[['lr',1],['lg',2],['lb',4]].forEach(([id,m])=>document.getElementById(id).classList.toggle('on',!!(g.lamps&m)))}

/* ============================ ATUALIZAÇÃO ============================ */
function moveRound(dt){
  const rd=g.rd;if(!rd)return;
  if(rd.type==='cls')rd.items.forEach(a=>{a.x+=a.vx*dt*DIFFS[diff].speed;a.flash=Math.max(0,a.flash-dt);if(a.vx>0&&a.x>W+70)a.x=-70;if(a.vx<0&&a.x<-70)a.x=W+70});
  if(rd.type==='quiz')rd.bubbles.forEach(b=>{b.ox=Math.sin(time*b.sp+b.ph)*b.amp;b.flash=Math.max(0,b.flash-dt)});
  if(rd.type==='region')rd.markers.forEach(m=>m.flash=Math.max(0,m.flash-dt));

function update(dt){
  time+=dt;g.cool=Math.max(0,g.cool-dt);
  bgStars.forEach(s=>{s.y+=s.z*8*dt;if(s.y>H){s.y=0;s.x=rnd(0,W)}});
  g.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});g.parts=g.parts.filter(p=>p.life>0);
  g.floats.forEach(f=>{f.y-=40*dt;f.life-=dt});g.floats=g.floats.filter(f=>f.life>0);
  g.beams.forEach(b=>b.t-=dt);g.beams=g.beams.filter(b=>b.t>0);
  g.shake=Math.max(0,g.shake-dt);g.flash=Math.max(0,g.flash-dt);
  if(g.msg){g.msg.life-=dt;if(g.msg.life<=0)g.msg=null}
  if(state==='gap'||state==='round'){
    const sp=480;if(keys.arrowleft||keys.a)cx-=sp*dt;if(keys.arrowright||keys.d)cx+=sp*dt;if(keys.arrowup||keys.w)cy-=sp*dt;if(keys.arrowdown||keys.s)cy+=sp*dt;
    cx=Math.max(0,Math.min(W,cx));cy=Math.max(40,Math.min(H-60,cy));

  if(state==='gap'){g.gap.t-=dt;if(g.gap.t<=0){if(g.gap.after){g.gap=null;nextRound()}else{g.gap=null;state='round'}}}

function arrow(x1,y1,x2,y2,col){ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);[0,1].forEach(k=>{const px=k?x1:x2,py=k?y1:y2,d=k?a+Math.PI:a;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-9*Math.cos(d-.4),py-9*Math.sin(d-.4));ctx.lineTo(px-9*Math.cos(d+.4),py-9*Math.sin(d+.4));ctx.closePath();ctx.fill()})}

    ctx.fillStyle='#ffd45a';ctx.beginPath();ctx.arc(70,200,22,0,7);ctx.fill();
    const hp=62,hx=230,bx=470,bh=170,r=70/60,sl=hp*r,sb=bh*r;
    ctx.strokeStyle='rgba(255,230,120,.7)';ctx.lineWidth=1.5;[[hx,gy-hp,hx+sl,gy],[bx,gy-bh,bx+sb,gy]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1-(x2-x1)*1.3,y1-(y2-y1)*1.3);ctx.lineTo(x2,y2);ctx.stroke()});
    ctx.fillStyle='#3c8f5a';ctx.fillRect(hx-3,gy-hp,6,hp);ctx.fillStyle='#4b6f9a';ctx.fillRect(bx-24,gy-bh,48,bh);
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(hx,gy-3,sl,6);ctx.fillRect(bx,gy-3,sb,6);
    ctx.fillStyle='#fff';ctx.fillText(`h = ${nf(dr.h)} m`,hx-52,gy-hp/2);ctx.fillText(`s = ${nf(dr.s)} m`,hx+sl/2,gy+18);
    ctx.fillText('H = ?',bx-52,gy-bh/2);ctx.fillText(`S = ${nf(dr.S)} m`,bx+sb/2,gy+18);
    ctx.fillStyle='#9fb6cf';ctx.font='600 12px Inter,Arial';ctx.fillText('raios solares paralelos · figura fora de escala',360,190);
  }else if(dr.k==='cam'){
    const ax=290,by0=235,by1=345,ox=290,oy=290,rx=560;
    ctx.strokeStyle='#9fb6cf';ctx.lineWidth=3;ctx.strokeRect(ax,by0,rx-ax,by1-by0);ctx.fillStyle='#0b1524';ctx.fillRect(ax+1,by0+1,rx-ax-2,by1-by0-2);
    ctx.fillStyle='#ffca3a';ctx.beginPath();ctx.arc(ox,oy,4,0,7);ctx.fill();ctx.fillText('O',ox-12,oy-2);
    arrow(120,340,120,240,'#72e0a4');ctx.fillStyle='#72e0a4';ctx.fillText(dr.ask==='m'?'m = ?':`m = ${nf(dr.m)} m`,120,225);
    ctx.strokeStyle='rgba(87,215,255,.8)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(120,240);ctx.lineTo(rx,330);ctx.moveTo(120,340);ctx.lineTo(rx,250);ctx.stroke();
    arrow(rx,326,rx,254,'#ff9b3d');ctx.fillStyle='#ff9b3d';ctx.fillText(dr.ask==='n'?'n = ?':`n = ${nf(dr.n)} cm`,rx+40,290);
    arrow(120,372,ax,372,'#cfe0f2');ctx.fillStyle='#cfe0f2';ctx.fillText(dr.ask==='a'?'a = ?':`a = ${nf(dr.a)} m`,205,388);
    arrow(ax,372,rx,372,'#cfe0f2');ctx.fillText(`b = ${nf(dr.b)} cm`,425,388);
  }else if(dr.k==='point'){
    const sx=90,sy=295,px=280,qx=600,r=(dr.d1+dr.d2)/dr.d1,ph=26,qh=Math.min(120,ph*r);
    ctx.shadowColor='#ffe58a';ctx.shadowBlur=16;ctx.fillStyle='#fff6c0';ctx.beginPath();ctx.arc(sx,sy,7,0,7);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,230,120,.7)';ctx.lineWidth=1.5;[-1,1].forEach(sg=>{ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(qx,sy+sg*qh);ctx.stroke()});
    ctx.fillStyle='#4b5c72';ctx.fillRect(px-5,sy-ph,10,ph*2);ctx.fillStyle='#0a0a0a';ctx.fillRect(qx-4,sy-qh,8,qh*2);ctx.strokeStyle='#cfe0f2';ctx.strokeRect(qx-4,sy-qh,8,qh*2);
    ctx.fillStyle='#fff';ctx.fillText('fonte',sx,sy+24);ctx.fillText(`placa (lado ${nf(dr.l)} cm)`,px,sy+ph+18);ctx.fillText('lado da sombra = ?',qx-10,sy-qh-16);
    arrow(sx,372,px,372,'#cfe0f2');ctx.fillStyle='#cfe0f2';ctx.fillText(`${nf(dr.d1)} m`,(sx+px)/2,388);arrow(px,372,qx,372,'#cfe0f2');ctx.fillText(`${nf(dr.d2)} m`,(px+qx)/2,388);
  }
  ctx.restore();
}
function drawHUD(){
  ctx.fillStyle='rgba(5,11,20,.88)';ctx.fillRect(0,0,W,34);
  ctx.textBaseline='middle';ctx.textAlign='left';ctx.font='700 15px Inter,Arial,sans-serif';
  for(let i=0;i<g.maxShield;i++){ctx.fillStyle=i<g.shield?'#ff6b72':'#2a3d55';ctx.fillText('♥',10+i*17,18)}
  ctx.fillStyle='#ffca3a';ctx.textAlign='center';ctx.fillText('★ '+g.score+(g.combo>1?'   🔥×'+g.combo:''),W/2+30,18);
  ctx.textAlign='right';ctx.fillStyle=STAGES[g.stage].cor;ctx.font='700 12px Inter,Arial,sans-serif';let nm=STAGES[g.stage].nome;if(nm.length>22)nm=nm.slice(0,21)+'…';ctx.fillText((g.stage+1)+'/'+STAGES.length+' · '+nm,W-128,18);
  const rd=g.rd;if(rd&&rd.tmax&&(state==='round'||state==='gap')){
    const f=Math.max(0,(rd.t===undefined?rd.tmax:rd.t)/rd.tmax);ctx.fillStyle='#0a1a2b';ctx.fillRect(0,34,W,5);ctx.fillStyle=f<.25?'#ff6b72':STAGES[g.stage].cor;ctx.fillRect(0,34,W*f,5);
  }
}
function drawTurret(){
  ctx.save();const ang=Math.atan2(cy-782,cx-W/2)+Math.PI/2;ctx.translate(W/2,790);
  ctx.fillStyle='#22364f';ctx.strokeStyle='#57d7ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,10,34,Math.PI,0);ctx.fill();ctx.stroke();
  ctx.rotate(Math.max(-1.3,Math.min(1.3,ang)));ctx.fillStyle='#57d7ff';roundRect(-9,-38,18,48,5);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-4,-40,8,6);ctx.restore();
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  let sx=0,sy=0;if(g&&g.shake>0&&!window.PM_RM){sx=rnd(-4,4);sy=rnd(-4,4)}
  ctx.save();ctx.translate(sx,sy);drawBg();
  if(g&&g.rd&&state!=='title'){
    const rd=g.rd;
    if(rd.type==='cls')drawCls(rd);else if(rd.type==='make')drawMake(rd);else if(rd.type==='region')drawRegion(rd);else if(rd.type==='quiz')drawQuiz(rd);
    g.beams.forEach(b=>{const a=Math.max(0,b.t/.16);ctx.globalAlpha=a;ctx.strokeStyle=b.col;ctx.shadowColor=b.col;ctx.shadowBlur=16;ctx.lineWidth=2+6*a;ctx.beginPath();ctx.moveTo(W/2,770);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1});
    g.parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()});ctx.globalAlpha=1;
    drawTurret();drawHUD();
    g.floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life);ctx.fillStyle=f.c;ctx.font='800 20px Inter,Arial';ctx.textAlign='center';ctx.fillText(f.t,f.x,f.y)});ctx.globalAlpha=1;
    if(g.msg&&(state==='round'||state==='gap')){ctx.font='700 15px Inter,Arial';const w=Math.min(680,ctx.measureText(g.msg.text).width+30);ctx.fillStyle='rgba(5,11,20,.88)';roundRect(W/2-w/2,140,w,32,10);ctx.fill();ctx.fillStyle=g.msg.col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(g.msg.text,W/2,156)}
    if(state==='gap'&&g.gap&&g.gap.text){ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 34px Inter,Arial';ctx.fillStyle='rgba(255,255,255,'+Math.min(1,g.gap.t*2)+')';ctx.fillText(g.gap.text,W/2,H/2+20)}
    if(state==='round'||state==='gap'){ // mira
      const col=rd.type==='make'&&g.lamps?LCSS[g.lamps]:'#ffffff';ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.shadowColor=col;ctx.shadowBlur=8;
      ctx.beginPath();ctx.arc(cx,cy,17,0,7);ctx.moveTo(cx-27,cy);ctx.lineTo(cx-8,cy);ctx.moveTo(cx+8,cy);ctx.lineTo(cx+27,cy);ctx.moveTo(cx,cy-27);ctx.lineTo(cx,cy-8);ctx.moveTo(cx,cy+8);ctx.lineTo(cx,cy+27);ctx.stroke();ctx.shadowBlur=0;
    }
    if(g.flash>0&&!window.PM_RM){ctx.fillStyle='rgba(255,80,90,'+g.flash*.5+')';ctx.fillRect(0,0,W,H)}
  }
  ctx.restore();
}

/* ============================ ENTRADA E LOOP ============================ */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k==='m')muteBtn.click();
  if(k===' '){if(state==='feedback')afterFeedback();else fire()}
  if(k==='enter'){const b=document.getElementById('go')||document.getElementById('start');if(b&&ov.classList.contains('show'))b.click()}
  if(g&&g.rd&&g.rd.type==='make'&&(state==='round'||state==='gap')){const m={r:1,g:2,b:4,'1':1,'2':2,'3':4}[k];if(m){g.lamps^=m;syncLamps()}}
  if(k==='p'||k==='escape'){
    if(state==='round'){g.prevState=state;state='paused';show('<h2>⏸ Pausado</h2><button class="btn primary" id="go">Continuar</button>');document.getElementById('go').onclick=unpause}
    else if(state==='paused')unpause();
  }
});
function unpause(){state=g.prevState;hide()}
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>keys={});
function ptr(e){const r=cv.getBoundingClientRect();cx=(e.clientX-r.left)/r.width*W;cy=(e.clientY-r.top)/r.height*H}
cv.addEventListener('pointermove',ptr);
cv.addEventListener('pointerdown',e=>{ptr(e);fire()});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function fit(){stageEl.style.fontSize=(stageEl.clientWidth/720*16)+'px'}
addEventListener('resize',fit);fit();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(g&&state!=='title'&&state!=='paused'&&state!=='intro')update(dt);
  else{time+=dt;bgStars.forEach(s=>{s.y+=s.z*8*dt;if(s.y>H){s.y=0;s.x=rnd(0,W)}})}
  draw();requestAnimationFrame(loop);
}
g={stage:0,L:0,shield:0,maxShield:0,score:0,combo:0,rd:null,parts:[],floats:[],beams:[],msg:null,cool:0,shake:0,flash:0,gap:null,lamps:0};
titleScreen();requestAnimationFrame(loop);
</script>
<script data-goatcounter="https://professormadison.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
